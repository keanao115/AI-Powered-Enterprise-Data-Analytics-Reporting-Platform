[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = [
    "B008",  # Do not perform function calls in argument defaults (FastAPI Depends/Query)
    "E501",  # Line too long (managed by ruff format)
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = [".", "backend"]
