services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_analytics_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo_only_postgres_password_must_change}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_analytics_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEMO_MODE=${DEMO_MODE:-false}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./app.db}
      - ANALYTICS_DATABASE_URL=${ANALYTICS_DATABASE_URL:-duckdb:///./analytics_demo.duckdb}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-flash-latest}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
      - ALLOW_EXTERNAL_LLM_DATA=${ALLOW_EXTERNAL_LLM_DATA:-true}
      - SECRET_KEY=${SECRET_KEY:-docker-compose-secret-key-change-for-prod-min-32-chars!}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai_analytics_frontend
    ports:
      - "3300:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
