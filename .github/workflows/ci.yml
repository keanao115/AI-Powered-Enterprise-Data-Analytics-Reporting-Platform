name: Enterprise AI Data Platform CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Seed Synthetic Analytics Database
        run: |
          cd backend && python -m seed.seed_data

      - name: Run Unit, Integration & Security Pytest Suite
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run Text-to-SQL & Security Evaluation Benchmark
        run: |
          cd backend && python -m app.evaluation.eval_runner

      - name: Build Docker Container Suite
        run: |
          docker compose build
