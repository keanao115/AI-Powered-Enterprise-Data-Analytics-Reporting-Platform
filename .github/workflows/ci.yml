name: Enterprise AI Data Platform CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-audit:
    name: Code Quality & Supply Chain Security (SCA)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lint & Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install ruff pip-audit

      - name: Static Code Analysis & Linting (Ruff)
        run: |
          ruff check backend/ tests/ --exit-non-zero-on-fix || true

      - name: Software Supply Chain Vulnerability Scan (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt --desc on --ignore-vuln CVE-2024-5171 || true

  test-and-verify:
    name: Unit, Integration, Security & Benchmarks
    runs-on: ubuntu-latest
    needs: [lint-and-audit]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Seed Synthetic Analytics Database
        run: |
          cd backend && python -m seed.seed_data

      - name: Run Unit, Integration & Security Pytest Suite
        run: |
          python -m pytest tests/ -v --tb=short --cov=backend/app --cov-report=term-missing

      - name: Run Text-to-SQL & Security Evaluation Benchmark
        run: |
          cd backend && python -m app.evaluation.eval_runner

      - name: Build Docker Container Suite
        run: |
          docker compose build
